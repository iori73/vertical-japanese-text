<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Vertical Japanese Text icon</title>
<!--
  Same palette as the cover (note thumbnail system, design category): ground #491022, text #FCFAF2, accent #8F2E14, washi #E7DDC6.
  The glyph 縦 (tate, "vertical") reads at 32px; the line with two handles is the "drag the height" cue.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 128px; height: 128px; background: transparent; }
  .icon { position: relative; width: 128px; height: 128px; border-radius: 28px; background: #491022; overflow: hidden;
    font-family: 'YuGothic', 'Yu Gothic', 'Hiragino Sans', sans-serif; font-weight: 700; }
  .g { position: absolute; left: 0; right: 0; top: 10px; text-align: center; color: #FCFAF2; font-size: 82px; line-height: 1.15; }
  .line { position: absolute; left: 26px; right: 26px; bottom: 22px; height: 4px; background: #E7DDC6; }
  .h { position: absolute; bottom: 16px; width: 16px; height: 16px; background: #FCFAF2; border: 3px solid #8F2E14; }
</style>
</head>
<body>
  <div class="icon">
    <div class="g">縦</div>
    <div class="line"></div>
    <i class="h" style="left:18px"></i><i class="h" style="right:18px"></i>
  </div>
</body>
</html>
