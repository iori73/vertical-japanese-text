<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><title>carousel2</title>
<link rel="stylesheet" href="_carousel.css" />
<style>.panel { position: absolute; left: 1250px; top: 190px; width: 590px; background: #F2F2EA; color: var(--ink); padding: 34px 38px; border: 1px solid var(--line); font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif; }
.panel .pt { font-family: 'Baskerville','Hiragino Mincho ProN',serif; font-size: 30px; margin-bottom: 18px; }
.panel .lab { font-size: 18px; margin: 16px 0 6px; opacity: .65; }
.panel .sel { border: 1px solid var(--line); background: #fff8; padding: 11px 14px; font-size: 21px; }
.panel .chk { font-size: 21px; margin-top: 20px; } .panel .chk b { color: var(--green); margin-right: 8px; }
.panel .st { margin-top: 24px; font-size: 17px; opacity: .6; }</style></head>
<body>
<div class="tag">Figma plugin</div>
<div class="rule"></div>
<div class="title ja">数字・英字・句読点の<br>組み方をパネルで選ぶ</div>
<div class="sub ja">句読点のルールも、チェックひとつです。</div>
<div class="card" style="left:800px;top:300px;width:356px;height:470px"><div class="t" style="height:414px">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所で</div><i class="h a"></i><i class="h b"></i><i class="h c"></i><i class="h d"></i><span class="chip">410 px</span></div><div class="panel"><div class="pt">縦書き自動折り返し</div>
<div class="lab">数字</div><div class="sel">横並びで 1 マスに（縦中横・2 桁まで）</div>
<div class="lab">英字</div><div class="sel">横向き（90°回転）</div>
<div class="lab">句読点・括弧の縦書き表示</div><div class="sel">縦書き用の文字に置き換える</div>
<div class="chk"><b>✓</b> 行頭・行末のルールを守る</div><div class="chk"><b>✓</b> 句読点を列の下にはみ出させる</div>
<div class="st">6 列 ・ 1 列 12 字 ・ 高さ 410px</div></div>
</body></html>
