<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Vertical Japanese Text cover</title>
<style>
  :root { --ink: #1d1b19; --paper: #f4efe6; --muted: #7b756b; --blue: #0d99ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 960px; }
  body {
    background: var(--paper); color: var(--ink); overflow: hidden;
    font-family: 'Hiragino Mincho ProN', 'Shippori Mincho', 'Yu Mincho', serif;
    display: grid; grid-template-columns: 860px 1fr; align-items: center;
  }
  .left { padding: 0 0 0 130px; }
  .tag { font: 600 22px/1 'Inter', 'Hiragino Sans', sans-serif; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  h1 { font-weight: 600; font-size: 88px; line-height: 1.12; margin: 34px 0 6px; letter-spacing: .03em; white-space: nowrap; }
  .en { font: 500 34px/1.2 'Inter', 'Hiragino Sans', sans-serif; color: var(--muted); letter-spacing: .01em; }
  .lead { margin-top: 54px; font-size: 38px; line-height: 1.7; }
  .lead small { display: block; margin-top: 10px; font: 400 26px/1.5 'Inter', 'Hiragino Sans', sans-serif; color: var(--muted); }
  .right { position: relative; height: 960px; }
  .frame { position: absolute; outline: 2px solid var(--blue); background: #fff; padding: 22px 24px; }
  .frame .t {
    writing-mode: vertical-rl; font-size: 30px; line-height: 1.95; letter-spacing: .06em;
    height: 100%; text-orientation: mixed;
  }
  .frame .t b { font-weight: 400; text-combine-upright: all; }
  .h { position: absolute; width: 18px; height: 18px; background: #fff; border: 2px solid var(--blue); }
  .badge { position: absolute; background: var(--blue); color: #fff; font: 600 20px/1 'Inter', sans-serif; padding: 8px 12px; border-radius: 4px; white-space: nowrap; }
  .a { right: 650px; top: 150px; width: 250px; height: 700px; }
  .b { right: 70px; top: 330px; width: 470px; height: 360px; }
  .arrow { position: absolute; right: 560px; top: 465px; width: 70px; height: 90px; }
</style>
</head>
<body>
  <div class="left">
    <div class="tag">Figma plugin</div>
    <h1>縦書き自動折り返し</h1>
    <div class="en">Vertical Japanese Text — Auto Reflow</div>
    <p class="lead">枠の高さを動かすだけで、<br>縦書きが折り返す。
      <small>Drag the height. Vertical Japanese text reflows.</small></p>
  </div>
  <div class="right">
    <div class="frame a">
      <div class="t">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。</div>
      <i class="h" style="left:-10px;top:-10px"></i><i class="h" style="right:-10px;top:-10px"></i>
      <i class="h" style="left:-10px;bottom:-10px"></i><i class="h" style="right:-10px;bottom:-10px"></i>
      <span class="badge" style="left:50%;bottom:-48px;transform:translateX(-50%)">250 × 700 Hug</span>
    </div>
    <svg class="arrow" viewBox="0 0 120 90" fill="none" stroke="#7b756b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 45h96M80 20l26 25-26 25"/></svg>
    <div class="frame b">
      <div class="t">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。</div>
      <i class="h" style="left:-10px;top:-10px"></i><i class="h" style="right:-10px;top:-10px"></i>
      <i class="h" style="left:-10px;bottom:-10px"></i><i class="h" style="right:-10px;bottom:-10px"></i>
      <span class="badge" style="left:50%;bottom:-48px;transform:translateX(-50%)">470 × 360 Hug</span>
    </div>
  </div>
</body>
</html>
