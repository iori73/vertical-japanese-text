<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><title>carousel2</title>
<link rel="stylesheet" href="_carousel.css" />
<style>.panel{position:absolute;right:130px;top:290px;width:520px;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:30px 32px}
.panel .ttl{font-weight:700;font-size:26px;margin-bottom:22px}
.panel label{display:block;font-size:19px;color:var(--muted);margin:16px 0 6px}
.panel .sel{border:1.5px solid #d9d4ca;border-radius:8px;padding:12px 14px;font-size:22px}
.panel .chk{font-size:22px;margin-top:20px}.panel .chk b{color:var(--blue);margin-right:8px}
.panel .stat{margin-top:26px;font-size:18px;color:var(--muted)}</style></head>
<body>
<div class="head"><h1>数字・英字・字形を、パネルで選ぶ</h1><p>禁則処理と句読点のぶら下がりも、チェックひとつで切り替え。</p></div><div style="position:absolute;left:150px;top:330px"><div class="frame" style="height:430px"><i class="h a"></i><i class="h b"></i><i class="h c"></i><i class="h d"></i><div class="t">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</div><span class="badge">410 px</span></div></div>
<div class="panel">
  <div class="ttl">縦書き自動折り返し</div>
  <label>数字</label><div class="sel">縦中横（2 桁まで）</div>
  <label>英字</label><div class="sel">横向き</div>
  <label>縦書き字形</label><div class="sel">縦書き用の文字に置換</div>
  <div class="chk"><b>✓</b> 禁則処理</div>
  <div class="chk"><b>✓</b> 句読点のぶら下がり</div>
  <div class="stat">6 列 ・ 1 列 12 字 ・ 高さ 410px</div>
</div>
</body></html>
